name: desert_track
description: Desert & Off-Road GPS Navigation - Free, Offline
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Map display (OpenStreetMap / ESRI satellite tiles)
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # GPS location
  geolocator: ^11.0.0


  # Local database
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # HTTP for tile download + caching
  http: ^1.2.0
  # Sharing GPX/KML
  share_plus: ^7.2.2

  # State management
  provider: ^6.1.2

  # Utils
  intl: ^0.19.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
